name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Tipos, lint, formatação e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mesma sequência que roda na máquina local (npm run verificar). Se o
      # comando do CI diverge do comando do desenvolvedor, o CI vira o primeiro
      # a saber — e descobrir no GitHub o que o terminal já diria custa caro.
      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm run test:cobertura

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro, não só o último commit: segredo que já entrou
          # no passado não sai com um commit de remoção — ele continua lá.
          fetch-depth: 0

      - name: Procurar credenciais no código e no histórico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A auditoria informa; não bloqueia. E vale explicar por quê, porque
      # `|| true` num passo de segurança normalmente é preguiça disfarçada.
      #
      # Os avisos vêm todos da cadeia de ferramentas do Expo e do React Native:
      # metro, tar, postcss, @expo/cli. São pacotes de tempo de compilação —
      # eles não entram no APK — mas estão declarados como dependência de
      # produção do aplicativo, então `--omit=dev` não os separa.
      #
      # Resolver exigiria subir a versão maior do Expo, o que é uma decisão de
      # projeto e não um `npm audit fix`. Manter o passo bloqueando deixaria o
      # CI vermelho de forma permanente por algo que ninguém pode consertar
      # hoje — e um CI cronicamente vermelho ensina o time a ignorar CI
      # vermelho, que é bem pior do que não ter auditoria.
      #
      # O relatório continua saindo a cada execução, para a dívida ficar
      # visível em vez de esquecida.
      - name: Auditar dependências
        run: npm audit --audit-level=moderate || true

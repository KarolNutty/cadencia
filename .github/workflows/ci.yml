name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Tipos, lint, formatação e testes
    runs-on: ubuntu-latest

    # O Postgres sobe junto com o job. Sem ele, os testes que provam a
    # autorização por recurso, a rotação de token e o tratamento de injeção
    # simplesmente não rodam, e um pull request que quebre qualquer um deles
    # passa verde. Teste que só roda na máquina de quem escreveu não protege
    # nada.
    services:
      banco:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cadencia
          POSTGRES_PASSWORD: cadencia
          POSTGRES_DB: cadencia_teste
        ports:
          - 5433:5432
        # O job começa antes de o Postgres aceitar conexão. Sem esta espera, a
        # primeira migração falha com "connection refused" e parece erro de
        # configuração.
        options: >-
          --health-cmd "pg_isready -U cadencia -d cadencia_teste"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A mesma sequência do `npm run verificar` local. Se o comando do CI
      # diverge do comando de quem desenvolve, o CI vira o primeiro a saber, # e descobrir no GitHub o que o terminal já diria custa caro.
      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes sem infraestrutura
        run: npm run test:cobertura

      - name: Preparar o banco de teste
        run: cp .env.teste.example .env.teste

      - name: Testes de integração
        run: npm run test:integracao

      # Compilar é a única prova de que o painel realmente monta: teste passa
      # com um componente que nunca foi empacotado.
      - name: Build do painel
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 7

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: segredo que já entrou no passado não sai com um
          # commit de remoção, ele continua lá.
          fetch-depth: 0

      - name: Procurar credenciais no código e no histórico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Vulnerabilidades conhecidas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Falha em vulnerabilidade alta ou crítica; média e baixa entram no
      # relatório sem travar. Com a saída do React Native, a cadeia de
      # ferramentas que trazia dezenas de avisos insolúveis deixou o projeto, e
      # o passo voltou a bloquear, que é o que ele deve fazer.
      - name: Auditar dependências
        run: npm audit --audit-level=high

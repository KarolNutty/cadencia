<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadência · painel do professor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /*
       * O tema é aplicado antes de qualquer coisa desenhar.
       *
       * Deixar isso para o React fazer produz um flash branco no carregamento,
       * porque o HTML já pintou com o fundo padrão quando o componente monta.
       * São seis linhas aqui que evitam o efeito mais visível de tema escuro
       * mal feito.
       */
      (function () {
        var guardado = localStorage.getItem('cadencia.tema');
        var escuro =
          guardado === 'escuro' ||
          (guardado !== 'claro' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);

        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
      })();
    </script>

    <div id="raiz"></div>
    <script type="module" src="/src/principal.tsx"></script>
  </body>
</html>
